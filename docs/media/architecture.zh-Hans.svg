<text x="40" y="686" class="small">USB 用于安装固件；手机操作经局域网 WebRTC 与蓝牙，无需配套 iOS App。</text>
<rect x="48" y="326" width="295" height="73" rx="12" class="box" /><path class="line both" d="M344 362h91" /><path class="line both" d="M195 400v10" /><text x="62" y="347" class="small" style="font-size:16px">ChatGPT · 无状态转发</text><text x="62" y="369" class="small" style="font-size:13px">选定内容与短期访问令牌</text><text x="62" y="389" class="small" style="font-size:13px">图片与模型输出</text></svg>
