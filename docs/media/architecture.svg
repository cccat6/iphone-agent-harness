<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">iPhone Agent Harness architecture</title><desc id="desc">History, images and credentials are saved in your browser. APIs connect directly; ChatGPT subscriptions use a stateless relay for selected context, images, output and a short-lived access token. The relay does not store them or log bodies or credentials. Sign-in and refresh remain direct to OpenAI. Phone input uses local WebRTC and Bluetooth.</desc>
