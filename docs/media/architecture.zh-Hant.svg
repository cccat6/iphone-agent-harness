<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" lang="zh-Hant" xml:lang="zh-Hant">
<title id="title">iPhone Agent Harness 架構</title><desc id="desc">對話、圖片與憑證儲存在瀏覽器。一般 API 直連；ChatGPT 訂閱透過無狀態服務轉送選定內容、圖片、輸出及短期存取權杖，不儲存這些資料，也不記錄本文或憑證。登入與更新仍直連 OpenAI。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#cf4a2b" /></marker><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#332330}.title{font-size:25px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#746365}.box{fill:#fff;stroke:#e5c6bb;stroke-width:1.5}.line{fill:none;stroke:#cf4a2b;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="24" fill="#fffaf7" />
<text x="40" y="46" class="title">iPhone Agent Harness</text><text x="40" y="75" class="small">瀏覽器推理 · 本機裝置控制 · 自選模型</text>
<rect x="412" y="110" width="746" height="545" rx="22" fill="#fff0e9" stroke="#e3b7a7" stroke-dasharray="6 6" />
<text x="440" y="145" class="small">同一區域網路 Wi-Fi · 手機使用原來的網路</text>
<rect x="440" y="173" width="376" height="443" rx="25" fill="#fff" stroke="#b2573d" stroke-width="2" />
<text x="466" y="209" class="head">iPhone / iPad</text>
<rect x="466" y="237" width="324" height="154" rx="14" fill="#fff0e9" />
<text x="486" y="269" class="head">Safari · 網頁 Harness</text><text x="486" y="301" class="body">Agent 迴圈、提示詞與技能</text><text x="486" y="330" class="body">會話、圖片、金鑰：本機儲存</text><text x="486" y="359" class="small" style="font-size:13px">IndexedDB · 持續本機儲存</text>
<rect x="466" y="468" width="324" height="112" rx="14" fill="#fbf6f3" stroke="#e6d6cd" />
<text x="486" y="501" class="head">iOS 畫面與其他 App</text><text x="486" y="532" class="body">應用、控件與剪貼簿</text><text x="486" y="558" class="small">輔助觸控接收指標輸入</text>
<path class="line" d="M537 466v-66" /><text x="548" y="429" class="small">畫面共享</text><text x="548" y="449" class="small">本機觀察</text>
<rect x="48" y="144" width="295" height="157" rx="17" class="box" />
<text x="70" y="180" class="head">網站／自行託管</text><text x="70" y="214" class="body">靜態 HTML、JS 與韌體</text><text x="70" y="244" class="body">公開技能分享</text><text x="70" y="276" class="small" style="font-size:13px">轉送程式不持續儲存資料</text>
<path class="line" d="M345 218h90" /><text x="352" y="201" class="small">網頁</text>
<path class="line both" d="M344 280h92" /><text x="347" y="309" class="small">公開技能</text>
<rect x="48" y="413" width="295" height="164" rx="17" class="box" />
<text x="70" y="450" class="head">所選 AI／MCP 服務</text><text x="70" y="485" class="body">自有帳號或 API 端點</text><text x="70" y="515" class="body">接收選定的任務上下文</text><text x="70" y="548" class="small" style="font-size:13px">API／MCP 直連；訂閱經轉送</text>
<path class="line both" d="M343 443h50v-62h42" /><text x="352" y="476" class="small">HTTPS</text>
<rect x="906" y="256" width="228" height="174" rx="18" class="box" />
<text x="928" y="292" class="head">ESP32 橋</text><text x="928" y="326" class="body">定時執行輸入</text><text x="928" y="355" class="body">藍牙鍵盤</text><text x="928" y="383" class="body">與指標</text><text x="928" y="411" class="small">附近供電即可</text>
<path class="line both" d="M791 315h110" /><text x="821" y="288" class="small">WebRTC</text><text x="821" y="348" class="small">命令</text><text x="821" y="369" class="small">與回執</text>
