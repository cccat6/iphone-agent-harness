<text x="843" y="559" class="small">選用剪貼簿快捷指令：</text><text x="843" y="582" class="small">透過本機 HTTP 取得文字</text>
<text x="40" y="686" class="small">USB 用於安裝韌體；手機操作透過區域網路 WebRTC 與藍牙，無需配套 iOS App。</text>
<rect x="48" y="326" width="295" height="73" rx="12" class="box" /><path class="line both" d="M344 362h91" /><path class="line both" d="M195 400v10" /><text x="62" y="347" class="small" style="font-size:16px">ChatGPT · 無狀態轉送</text><text x="62" y="369" class="small" style="font-size:13px">選定內容與短期存取權杖</text><text x="62" y="389" class="small" style="font-size:13px">圖片與模型輸出</text></svg>
