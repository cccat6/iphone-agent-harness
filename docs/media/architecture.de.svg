<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" lang="de" xml:lang="de">
<title id="title">Architektur von iPhone Agent Harness</title><desc id="desc">Verlauf, Bilder und Zugangsdaten werden im Browser gespeichert. APIs verbinden sich direkt; ChatGPT-Abonnements nutzen einen zustandslosen Relay für gewählten Kontext, Bilder, Ausgaben und ein kurzlebiges Zugriffstoken. Er speichert sie nicht und protokolliert keine Inhalte oder Zugangsdaten. Anmeldung und Erneuerung gehen direkt an OpenAI.</desc>
