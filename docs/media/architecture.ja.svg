<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja">
<title id="title">iPhone Agent Harnessの構成</title><desc id="desc">サイトは静的ページと公開スキルを配信。Safariは会話とキーをローカルに保存し、選択した内容をAIへ直接送り、ローカルWebRTCでESP32とコマンド・応答を交換します。ESP32はBluetooth HIDで同じ電話を操作。電話USBケーブルやクラウド中継は不要です。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#356556" /></marker><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a31}.title{font-size:25px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#536b61}.box{fill:#fff;stroke:#bdcec5;stroke-width:1.5}.line{fill:none;stroke:#356556;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="24" fill="#f7faf8" />
<text x="40" y="46" class="title">iPhone Agent Harness</text><text x="40" y="75" class="small">ブラウザーで推論 · ローカル操作 · モデルを選択</text>
<rect x="412" y="110" width="746" height="545" rx="22" fill="#edf5f0" stroke="#aec6b7" stroke-dasharray="6 6" />
<text x="440" y="145" class="small">同じLAN Wi-Fi · 電話は普段のネットワークを使用</text>
<rect x="440" y="173" width="376" height="443" rx="25" fill="#fff" stroke="#456858" stroke-width="2" />
<text x="466" y="209" class="head">iPhone / iPad</text>
<rect x="466" y="237" width="324" height="154" rx="14" fill="#eaf1ee" />
<text x="486" y="269" class="head">Safari · Web Harness</text><text x="486" y="301" class="body">Agentループ・指示・スキル</text><text x="486" y="330" class="body">会話・画像・キーはローカル</text><text x="486" y="359" class="small" style="font-size:13px">IndexedDB · 会話をホストへ送信しない</text>
<rect x="466" y="468" width="324" height="112" rx="14" fill="#f4f6f5" stroke="#ccd8d1" />
<text x="486" y="501" class="head">iOS画面とほかのアプリ</text><text x="486" y="532" class="body" style="font-size:15px">アプリ・操作部品・クリップボード</text><text x="486" y="558" class="small" style="font-size:12px">AssistiveTouchがポインター入力を受信</text>
<path class="line" d="M537 466v-66" /><text x="548" y="429" class="small">画面共有</text><text x="548" y="449" class="small">ローカルで観察</text>
<rect x="48" y="144" width="295" height="157" rx="17" class="box" />
<text x="70" y="180" class="head">サイト／自己ホスト</text><text x="70" y="214" class="body" style="font-size:15px">静的HTML・JS・ファームウェア</text><text x="70" y="244" class="body">公開スキルの共有</text><text x="70" y="276" class="small" style="font-size:13px">会話・画像・キーは受け取らない</text>
<path class="line" d="M345 218h90" /><text x="352" y="201" class="small">ページ</text>
<path class="line both" d="M344 280h92" /><text x="347" y="309" class="small">公開スキル</text>
<rect x="48" y="413" width="295" height="164" rx="17" class="box" />
<text x="70" y="450" class="head">選択したAI / MCP</text><text x="70" y="485" class="body">自分のアカウントかAPI</text><text x="70" y="515" class="body">選択したタスク情報を受信</text><text x="70" y="548" class="small">Safariから直接接続</text>
<path class="line both" d="M343 443h50v-91h42" /><text x="352" y="476" class="small">HTTPS</text>
<rect x="906" y="256" width="228" height="174" rx="18" class="box" />
<text x="928" y="292" class="head">ESP32ブリッジ</text><text x="928" y="326" class="body">時刻に沿った入力</text><text x="928" y="355" class="body">Bluetoothキーボード</text><text x="928" y="383" class="body">とポインター</text><text x="928" y="411" class="small">近くで給電して設置</text>
<path class="line both" d="M791 315h110" /><text x="821" y="288" class="small">WebRTC</text><text x="821" y="348" class="small">コマンド</text><text x="821" y="369" class="small">と応答記録</text>
<path class="line" d="M1020 434v89H795" /><text x="850" y="508" class="body">Bluetooth HID</text>
<text x="843" y="559" class="small" style="font-size:13px">任意のコピー用ショートカット：</text><text x="843" y="582" class="small" style="font-size:13px">ローカルHTTPでテキスト取得</text>
<text x="40" y="686" class="small">USBは初回の書き込みに使用。電話ケーブル、クラウド操作中継、専用iOSアプリは不要。</text>
</svg>
