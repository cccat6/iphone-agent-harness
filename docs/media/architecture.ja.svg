<rect x="466" y="237" width="324" height="154" rx="14" fill="#fff0e9" />
<text x="486" y="269" class="head">Safari · Web Harness</text><text x="486" y="301" class="body">Agentループ・指示・スキル</text><text x="486" y="330" class="body">会話・画像・キーはローカル</text><text x="486" y="359" class="small" style="font-size:13px">IndexedDB · 端末に永続保存</text>
