<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" lang="es" xml:lang="es">
<title id="title">Arquitectura de iPhone Agent Harness</title><desc id="desc">El sitio sirve páginas estáticas y habilidades públicas. Safari guarda chats y claves localmente, envía contexto elegido directamente a la IA e intercambia comandos y recibos con ESP32 por WebRTC local. ESP32 opera el mismo teléfono con Bluetooth HID. Sin USB al teléfono ni relé de comandos en la nube.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#356556" /></marker><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a31}.title{font-size:25px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#536b61}.box{fill:#fff;stroke:#bdcec5;stroke-width:1.5}.line{fill:none;stroke:#356556;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="24" fill="#f7faf8" />
<text x="40" y="46" class="title">iPhone Agent Harness</text><text x="40" y="75" class="small">Razonamiento web · control local · modelo a tu elección</text>
<rect x="412" y="110" width="746" height="545" rx="22" fill="#edf5f0" stroke="#aec6b7" stroke-dasharray="6 6" />
<text x="440" y="145" class="small">MISMA WI-FI LOCAL · el teléfono sigue en su red habitual</text>
<rect x="440" y="173" width="376" height="443" rx="25" fill="#fff" stroke="#456858" stroke-width="2" />
<text x="466" y="209" class="head">iPhone / iPad</text>
<rect x="466" y="237" width="324" height="154" rx="14" fill="#eaf1ee" />
<text x="486" y="269" class="head">Safari · Web Harness</text><text x="486" y="301" class="body" style="font-size:16px">Ciclo, instrucciones y habilidades</text><text x="486" y="330" class="body">Chats, imágenes, claves: local</text><text x="486" y="359" class="small" style="font-size:14px">IndexedDB · sin enviar chats al host</text>
<rect x="466" y="468" width="324" height="112" rx="14" fill="#f4f6f5" stroke="#ccd8d1" />
<text x="486" y="501" class="head">Pantalla iOS + otras apps</text><text x="486" y="532" class="body">Apps, controles y portapapeles</text><text x="486" y="558" class="small">AssistiveTouch recibe el puntero</text>
<path class="line" d="M537 466v-66" /><text x="548" y="429" class="small">Compartir pantalla</text><text x="548" y="449" class="small">observación local</text>
<rect x="48" y="144" width="295" height="157" rx="17" class="box" />
<text x="70" y="180" class="head" style="font-size:20px">Sitio / autoalojamiento</text><text x="70" y="214" class="body">HTML, JS y firmware estáticos</text><text x="70" y="244" class="body">Compartir habilidades</text><text x="70" y="276" class="small">Sin chats, capturas ni claves</text>
<path class="line" d="M345 218h90" /><text x="352" y="201" class="small">Páginas</text>
<path class="line both" d="M344 280h92" /><text x="347" y="309" class="small"><tspan x="347" dy="0">Habilidades</tspan><tspan x="347" dy="17">públicas</tspan></text>
<rect x="48" y="413" width="295" height="164" rx="17" class="box" />
<text x="70" y="450" class="head">IA / MCP elegidos</text><text x="70" y="485" class="body">Tu cuenta o API</text><text x="70" y="515" class="body">Recibe el contexto elegido</text><text x="70" y="548" class="small">Conexión directa desde Safari</text>
<path class="line both" d="M343 443h50v-91h42" /><text x="352" y="476" class="small">HTTPS</text>
<rect x="906" y="256" width="228" height="174" rx="18" class="box" />
<text x="928" y="292" class="head">Puente ESP32</text><text x="928" y="326" class="body">Entradas temporizadas</text><text x="928" y="355" class="body">Teclado Bluetooth</text><text x="928" y="383" class="body">y puntero</text><text x="928" y="411" class="small">Alimentación cerca</text>
<path class="line both" d="M791 315h110" /><text x="821" y="288" class="small">WebRTC</text><text x="821" y="348" class="small">Órdenes</text><text x="821" y="369" class="small">+ recibos</text>
<path class="line" d="M1020 434v89H795" /><text x="850" y="508" class="body">Bluetooth HID</text>
<text x="843" y="559" class="small">Atajo de copia opcional:</text><text x="843" y="582" class="small">texto mediante HTTP local</text>
<text x="40" y="686" class="small">USB solo para instalar firmware. Sin cable al teléfono, relé de comandos en la nube ni app iOS adicional.</text>
</svg>
