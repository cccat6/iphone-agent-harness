<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>后台 LLM 传输验证</title><style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 18px;background:#fafafa;color:#171717}button,input,select{font:inherit;padding:12px;margin:5px 0;max-width:100%;box-sizing:border-box}button{border:1px solid #aaa;border-radius:12px;background:white}pre{white-space:pre-wrap;font:12px ui-monospace;max-height:38vh;overflow:auto;background:#eee;padding:12px}video{width:130px}label{display:block}input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}</style><h1>后台 LLM 传输验证</h1><p>版本 3 · 不控制手机，不上传屏幕。仅传测试时间、可见性和字节计数；真实 API 回复仅在当前页面内处理。</p><p id="state">准备中</p><div class="row"><button id="realboth">后台真实四轮（手动测试凭据）</button><button id="share">1. 开始屏幕共享</button><button id="run">2. 后台基础测试（约3分钟）</button><button id="stop">停止</button><button id="export">导出本地元数据</button></div><details><summary>扩展测试</summary><button data-suite="delays">10/30/60/120 秒等待（约4分钟）</button><button data-suite="five">连续五轮（约1分钟）</button><button data-suite="edges">碎片／空闲／中断（约1分钟）</button></details><details><summary>真实 API：凭据只在内存，不发给探针服务</summary><label>协议<select id="protocol"><option value="openai">OpenAI Chat Completions 风格</option><option value="anthropic">Anthropic Messages 风格</option></select></label><label>完整 endpoint<input id="endpoint" type="url" autocomplete="off" placeholder="https://…/v1/chat/completions"></label><label>模型<input id="model" autocomplete="off"></label><label>API Key<input id="key" type="password" autocomplete="off"></label><button id="deepseekpreset">填入 DeepSeek Flash（不填密钥）</button><button id="realstream">测试真实流式</button><button id="realjson">测试真实普通响应</button><p>本次授权的自动配置已结束并移除，后续测试需要重新配置。点击后切到其他 App；检测到后台再等待5秒，自动依次测试两种协议的普通和流式回复。只发送固定文本测试句，不发送屏幕。错误只记录类型和 HTTP 状态，不记录服务端回复。</p></details><video id="preview" autoplay muted playsinline></video><pre id="log"></pre><script type="module" src="./probe.js"></script></html>
