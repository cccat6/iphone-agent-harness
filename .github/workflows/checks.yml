name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m pip install jsonschema==4.25.1
      - run: python3 tools/validate_design_specs.py
      - run: ./tests/firmware/run.sh
      - run: IAH_R7_CANCEL_POSITION_REPRO=1 python3 tests/firmware/independent_router_r7.py
      - run: python3 tests/firmware/independent_router_r8.py
      - run: python3 tools/fetch_test_headers.py
      - run: ./tests/firmware/run_canonical.sh build/test-headers
      - run: python3 tools/build_firmware_test.py
      - run: python3 tools/build_firmware.py --verify-only
