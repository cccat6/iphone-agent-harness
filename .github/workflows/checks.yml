name: Manual release
on:
  workflow_dispatch:

# Only an explicit request starts this workflow. Pushes, PRs and tags do not.
permissions:
  contents: read
concurrency:
  group: igent-production-release
  cancel-in-progress: false

env:
  CLOUDFLARE_SEND_METRICS: 'false'
  CLOUDFLARE_ACCOUNT_ID: '930fbb0ded7a94817e4b30b0e9e43739'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Set repository secret CLOUDFLARE_API_TOKEN before requesting a release.'
            exit 1
          fi
      - run: npm ci
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Web and contract checks
        env:
          CXX: clang++
        run: |
          npm test
          python3 tools/validate_design_specs.py
          python3 tools/fetch_test_headers.py
          ARDUINOJSON_INCLUDE=build/test-headers ./tests/firmware/run.sh
          IAH_R7_CANCEL_POSITION_REPRO=1 python3 tests/firmware/independent_router_r7.py
          python3 tests/firmware/independent_router_r8.py
          ./tests/firmware/run_canonical.sh build/test-headers
          ./tests/firmware/run_html_render.sh build/test-headers
          ARDUINOJSON_INCLUDE=build/test-headers sh tests/firmware/rtc/run.sh
          python3 tools/verify_rtc_tls_link_test.py
          python3 tools/build_c2_sdk_test.py
          python3 tools/build_firmware_test.py
          python3 tools/firmware_release_test.py
      - name: Reuse firmware for unchanged sources and build configuration
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/firmware_release.py plan
      - name: Install pinned Arduino toolchain only when compilation is needed
        if: steps.firmware.outputs.compile == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/iah-arduino-cli"
          curl --fail --location --retry 3 \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz \
            --output "$RUNNER_TEMP/iah-arduino-cli/cli.tar.gz"
          printf '%s  %s\n' 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b \
            "$RUNNER_TEMP/iah-arduino-cli/cli.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/iah-arduino-cli/cli.tar.gz" -C "$RUNNER_TEMP/iah-arduino-cli" arduino-cli
          echo "$RUNNER_TEMP/iah-arduino-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iah-arduino-cli/arduino-cli" core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          "$RUNNER_TEMP/iah-arduino-cli/arduino-cli" core install esp32:esp32@3.3.11 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          "$RUNNER_TEMP/iah-arduino-cli/arduino-cli" lib install 'NimBLE-Arduino@2.5.1' 'ArduinoJson@7.4.3'
      - name: Build the pinned ESP32-C2 SDK only when compilation is needed
        if: steps.firmware.outputs.compile == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf bison flex gawk libffi-dev libssl-dev python3-venv
          python3 tools/build_c2_sdk.py --jobs 2
      - name: Compile supported ESP32 firmware profiles
        if: steps.firmware.outputs.compile == 'true'
        run: |
          python3 tools/build_firmware.py --parallel 1 --jobs 2
          python3 tools/firmware_release.py seal
      - name: Verify exact firmware inputs and all binary parts
        run: |
          python3 tools/build_firmware.py --verify-only
          python3 tools/firmware_release.py verify
      - name: Build website with the selected firmware binaries
        run: |
          npm run build
          ./node_modules/.bin/wrangler deploy --config wrangler.relay.production.jsonc --dry-run --outdir build/relay-worker-dry-run
          ./node_modules/.bin/wrangler deploy --dry-run --outdir build/worker-dry-run
      - name: Publish or reuse immutable firmware Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/firmware_release.py publish
      - name: Deploy the regional subscription relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.relay.production.jsonc
      - name: Deploy website and firmware together to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ./node_modules/.bin/wrangler d1 execute igent-skills --remote --file apps/web/api/schema.sql --yes
          ./node_modules/.bin/wrangler deploy
      - name: Verify every deployed file, including online-flashing binaries
        run: node tools/verify_release_site.mjs --output build/deployed-site-verification.json
      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build/firmware-plan.json
            apps/web/firmware/build-inputs.json
            apps/web/firmware/build-report.json
            build/deployed-site-verification.json
