<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="referrer" content="no-referrer"><title>WebRTC 局域网直连测试</title><link rel="stylesheet" href="./lan.css"><style>:root{color-scheme:light;background:#fff;color:#202124}body{padding:24px 20px}button{margin:4px 4px 4px 0;border:1px solid #bbb;border-radius:10px;background:#f5f5f5}button:disabled{opacity:.5}#status{padding:16px;background:#f4f4f4;border-radius:10px;font-weight:600}#status[data-state=pass]{background:#e4f6e9}#status[data-state=fail]{background:#fff0ed}dl{display:grid;grid-template-columns:8rem 1fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}a{color:inherit}</style><main><h1>WebRTC 直连测试（历史原型）</h1><p>本页测试旧版回传协议。正式设备请<a href="/">打开 Harness</a>连接，不再使用本页。</p><p>只向同一 Wi-Fi 内的测试端发送少量回传消息。不控制手机，不通过服务器转发，不打开其他标签页。</p><p id="endpoint">正在读取公开测试配置…</p><button id="connect" disabled>测试直连</button><p id="status" role="status" aria-live="polite">准备中</p><dl><dt>ICE</dt><dd id="ice">—</dd><dt>DTLS</dt><dd id="dtls">—</dd><dt>数据通道</dt><dd id="channel">—</dd><dt>回传</dt><dd id="echo">—</dd></dl><h2>共享屏幕时的连接</h2><p>Safari 可能限制未共享媒体时的局域网连接。若上面失败，仍可点“共享屏幕后测试直连”。同意共享后切到时钟约 35 秒，再返回查看结果。无需开启摄像头或麦克风。</p><button id="capture-connect" disabled>共享屏幕后测试直连</button><button id="background" disabled>测试已连接通道的后台回传</button><button id="stop" disabled>停止测试</button><p>屏幕图像不保存、不上传。共享测试完成或失败时，自动停止共享并关闭连接。</p><button id="copy">复制结果</button><span id="copy-status" role="status"></span><details><summary>详细结果</summary><pre id="result"></pre></details><p><a href="/main">返回主页</a></p></main><script type="module" src="./rtc-direct.js"></script></html>
