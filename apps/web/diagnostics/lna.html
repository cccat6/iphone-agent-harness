<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer"><title>ESP32 局域网直连测试</title><link rel="stylesheet" href="./lan.css"><style>:root{color-scheme:light;background:#fff;color:#202124}body{padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}button{border:1px solid #bbb;border-radius:10px;background:#f5f5f5;margin:4px 4px 4px 0}button:disabled{opacity:.5}#status{padding:16px;background:#f4f4f4;border-radius:10px;font-weight:600}#status[data-state=pass]{background:#e4f6e9}#status[data-state=fail]{background:#fff0ed}li{margin:10px 0}select{padding:10px;font:inherit;max-width:100%}a{color:inherit}</style><main><h1>局域网直连测试</h1><p>本页直接连接 ESP32，不打开新标签页、不发送手机操作。</p><label>ESP32 地址<input id="address" type="url" value="http://igent.local" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false"></label><p id="fixture-note" hidden></p><button id="run" type="button">测试直连</button><p id="status" role="status" aria-live="polite">准备就绪</p><ul id="summary"></ul><section><h2>后台连接</h2><p>前台测试通过后可测试。点开始、同意共享屏幕，再切到时钟约 30 秒。仅检查连接；图像不保存、不上传，完成或失败时自动停止共享。</p><label>测试目标 <select id="background-target" disabled></select></label><button id="background" type="button" disabled>开始录屏并测试后台</button><button id="stop" type="button" disabled>停止测试</button></section><button id="copy" type="button">复制测试结果</button><span id="copy-status" role="status"></span><details><summary>详细结果</summary><pre id="result"></pre></details><p><a href="/main">返回主页</a></p></main><script type="module" src="./lna.js"></script></html>
