<!doctype html><html lang="en"><meta charset="utf-8"><title>Independent R2 MCP real HTTP mock fixture</title><body><h1>Independent R2 MCP real HTTP mock fixture</h1><p>Loopback mock server, native browser fetch, production access manager. No model, hardware, credentials or external service.</p><button id="run">Run readonly CORS echo acceptance</button><button id="family">Diagnose native fetch receiver family</button><pre id="family-result"></pre><button id="raw">Diagnose raw native HTTP client</button><pre id="raw-result"></pre><pre id="result">Not run</pre><script type="module">
import {MCPClient,createMCPAccess} from '/core/mcp.js';
import {CommunityClient} from '/community/client.js';import {DeviceClient} from '/core/device.js';import {DeviceCodeAuth} from '/core/auth.js';
const out=document.querySelector('#result');document.querySelector('#raw').onclick=async()=>{try{await new MCPClient({url:'http://127.0.0.1:18853/mcp',token:'mock-r2-token'}).initialize();document.querySelector('#raw-result').textContent='raw initialized';}catch(e){document.querySelector('#raw-result').textContent=e.stack;}};
document.querySelector('#family').onclick=async()=>{let log=[];for(const [name,run] of [['CommunityClient',()=>new CommunityClient({baseUrl:'http://127.0.0.1:18853/api'}).list()],['DeviceClient readonly',()=>new DeviceClient({baseUrl:'https://127.0.0.1:18853'}).capabilities()],['DeviceCodeAuth',()=>new DeviceCodeAuth({clientId:'fixture-only',userCodeUrl:'http://127.0.0.1:18853/mock-auth'}).start()]]){try{await run();log.push(name+': returned');}catch(e){log.push(name+': '+(e.code||e.name)+' '+e.message);}}document.querySelector('#family-result').textContent=log.join('\n');};document.querySelector('#run').onclick=async()=>{const log=[];try{const a=createMCPAccess();a.configure({id:'r2',url:'http://127.0.0.1:18853/mcp',token:'mock-r2-token'});await a.connect('r2');log.push('initialize + initialized + tools/list: OK');log.push('initial authorized count: '+(await a.listForModel()).tools.length);a.setAllowedTools('r2',['echo']);log.push('selected while disabled count: '+(await a.listForModel()).tools.length);a.setEnabled('r2',true);log.push('enabled authorized tools: '+(await a.listForModel()).tools.map(t=>t.name).join(','));try{await a.call({serverId:'r2',name:'echo',arguments:{text:'independent-r2-readonly-echo'}},{mode:'chat'});throw Error('chat incorrectly allowed');}catch(e){if(e.code!=='MCP_MODE_NOT_ALLOWED')throw e;log.push('Chat call blocked: '+e.code);}const r=await a.call({serverId:'r2',name:'echo',arguments:{text:'independent-r2-readonly-echo'}},{mode:'task'});if(r.result.content[0].text!=='independent-r2-readonly-echo')throw Error('echo mismatch');log.push('Task HTTP echo: '+r.result.content[0].text);a.disconnect('r2');log.push('after revoke authorized count: '+(await a.listForModel()).tools.length);try{await a.call({serverId:'r2',name:'echo',arguments:{text:'must-not-send'}},{mode:'task'});throw Error('revoked incorrectly allowed');}catch(e){if(e.code!=='MCP_NOT_CONFIGURED')throw e;log.push('revoked call blocked: '+e.code);}out.textContent='PASS\n'+log.join('\n');}catch(e){out.textContent='FAIL\n'+log.join('\n')+'\n'+e.stack;}};
</script></body></html>
