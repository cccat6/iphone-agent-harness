<!doctype html><meta charset="utf-8"><title>Isolated panel error localization acceptance</title>
<h1>Isolated panel error localization acceptance</h1><p>Actual UI components, synthetic data only. No USB, Bluetooth, screen sharing, network or model request.</p><button id="run">Run all panel locale checks</button><pre id="result">Not run</pre><div id="usb"></div><div id="mcp"></div><dialog id="dialog"><div id="panel"></div></dialog>
<script type="module">
import {createDevicePanel} from '../../apps/web/ui/device-panel.js';
import {mountUsbSetup} from '../../apps/web/ui/usb-setup.js';
import {createMCPSettings} from '../../apps/web/ui/mcp-settings.js';
import {openStore} from '../../apps/web/core/store.js';
import {setLocale,localizeError,SUPPORTED_LOCALES} from '../../apps/web/i18n.js';
import {DEVICE_MESSAGES} from '../../apps/web/locales/device.js';
const one=s=>document.querySelector(s),assert=(value,label)=>{if(!value)throw new Error(label);};
one('#run').onclick=async()=>{
 const checks=[];let device,usb,mcp;setLocale('en');
 try{
  const store=await openStore({memory:true}),endpoint='https://harness-fixture.local';await store.saveSettings({deviceEndpoint:endpoint,deviceFingerprint:'a'.repeat(64)});
  const transport=Object.assign(new Error('DEVICE_TLS_OR_NETWORK_ERROR'),{code:'DEVICE_TLS_OR_NETWORK_ERROR'});let pairCount=0;
  device=createDevicePanel({store,capture:{active:false},clientFactory:()=>({async pair(){pairCount++;throw transport;}}),openPanel:(title,subtitle,body)=>{one('#panel').innerHTML='<h2>'+title+'</h2><div class="panel-body">'+body+'</div>';one('#dialog').showModal();},getPanelRoot:()=>one('.panel-body')});
  await device.open();one('[data-fingerprint]').value='bad';await one('[data-pair]').onclick();
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);assert(one('[data-device-status]').textContent===DEVICE_MESSAGES[code].operationFailed.replace('{detail}',DEVICE_MESSAGES[code].invalidFingerprint),'device validation '+code);assert(one('[data-address]').value===endpoint,'endpoint changed');}checks.push('device-validation-error-eight-locales');
  setLocale('en');one('[data-fingerprint]').value='a'.repeat(64);one('[data-pin-confirmed]').checked=true;one('[data-owner-password]').value='synthetic-owner';await one('[data-pair]').onclick();
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);assert(one('[data-device-status]').textContent===DEVICE_MESSAGES[code].operationFailed.replace('{detail}',localizeError(transport)),'device transport '+code);assert(one('[data-owner-password]').value==='','owner field not cleared');}assert(pairCount===1,'extra fake pairing');checks.push('device-transport-error-eight-locales-one-fake-pair');
  one('#dialog').close();device.dispose();
  const mcpError=Object.assign(new Error('MCP_CONNECTION_FAILED'),{code:'MCP_CONNECTION_FAILED'});let connects=0;
  mcp=createMCPSettings({store,access:{getSnapshot:()=>[],disconnect(){},configure(){},async connect(){connects++;throw mcpError;}}});mcp.mount(one('#mcp'),{endpoint:'https://fixture.invalid/mcp'});one('[data-mcp-token]').value='synthetic-token';await one('[data-mcp-connect]').onclick();
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);assert(one('[data-mcp-status]').textContent===localizeError(mcpError),'MCP '+code);assert(one('[data-mcp-token]').value==='','MCP token not cleared');}assert(connects===1,'extra fake connect');checks.push('mcp-error-eight-locales-one-fake-connect');
  const usbError=Object.assign(new Error('USB setup could not be read before the request ended'),{code:'flash_setup_timeout'});let reads=0;
  usb=mountUsbSetup({container:one('#usb'),canRead:()=>true,readSetup:async()=>{reads++;throw usbError;}});await one('[data-usb-read]').onclick();
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);assert(one('[data-usb-status]').textContent===localizeError(usbError),'USB transport '+code);}assert(reads===1,'extra fake USB read');checks.push('usb-transport-error-eight-locales-one-fake-read');usb.dispose();
  setLocale('en');reads=0;usb=mountUsbSetup({container:one('#usb'),canRead:()=>true,readSetup:async({profile}={})=>{reads++;return profile?{publicKeyFingerprint:'b'.repeat(64),mobileconfig:'mock'}:{boardId:'mock-board',apSsid:'mock',apPassword:'synthetic-ap',setupPassword:'synthetic-owner',httpsUrl:endpoint,caReady:true,publicKeyFingerprint:'a'.repeat(64)};}});await one('[data-usb-read]').onclick();await one('[data-usb-profile]').onclick();
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);assert(one('[data-usb-status]').textContent===DEVICE_MESSAGES[code].usbProfileMismatch,'USB profile mismatch '+code);}assert(reads===2,'extra profile read');checks.push('usb-profile-error-eight-locales-no-new-read');
  one('#result').textContent=JSON.stringify({passed:true,componentCases:checks.length,localeAssertions:checks.length*SUPPORTED_LOCALES.length,checks},null,2);
 }catch(error){one('#result').textContent=JSON.stringify({passed:false,error:error.message},null,2);}
 finally{device?.dispose();usb?.dispose();mcp?.disposeView();if(one('#dialog').open)one('#dialog').close();setLocale('auto');}
};
</script>
