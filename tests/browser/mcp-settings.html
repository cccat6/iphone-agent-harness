<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP permissions · isolated fixture</title><link rel="stylesheet" href="../../apps/web/styles.css"><body style="max-width:760px;margin:auto;padding:24px"><h1>MCP permissions · isolated fixture</h1><p>No model or real MCP server is contacted. The actual MCP manager uses an injected mock transport.</p><select id="language" aria-label="Fixture language"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option></select><div id="mcp"></div><button id="inspect" class="secondary-button">Inspect model-visible authorized directory</button><pre id="result">No saved endpoint.</pre><pre id="directory">No authorized tools.</pre><script type="module">
import {createMCPAccess} from '../../apps/web/core/mcp.js';import {createMCPSettings} from '../../apps/web/ui/mcp-settings.js';import {setLocale} from '../../apps/web/i18n.js';setLocale('en');
const access=createMCPAccess({fetchImpl:async(_url,request)=>{const rpc=JSON.parse(request.body);if(rpc.method==='notifications/initialized')return new Response(null,{status:202});const result=rpc.method==='initialize'?{protocolVersion:'2025-11-25',capabilities:{tools:{}},serverInfo:{name:'Fixture only'}}:rpc.method==='tools/list'?{tools:[{name:'echo',description:'Returns its supplied text. Mock transport only.',inputSchema:{type:'object',properties:{text:{type:'string'}},required:['text'],additionalProperties:false}},{name:'设置',description:'查看',inputSchema:{type:'object',properties:{},additionalProperties:false}}]}:{content:[{type:'text',text:'mock result'}]};return new Response(JSON.stringify({jsonrpc:'2.0',id:rpc.id,result}),{headers:{'content-type':'application/json'}});}});
let settings={};const store={saveSettings:async patch=>(settings={...settings,...patch})};
createMCPSettings({access,store,onSettingsChange:value=>document.querySelector('#result').textContent='Saved public settings: '+JSON.stringify(value)}).mount(document.querySelector('#mcp'),{endpoint:'https://mcp-fixture.invalid/mcp?auth=mock-only-query'});
document.querySelector('#inspect').onclick=async()=>{const result=await access.listForModel();document.querySelector('#directory').textContent='Authorized tools: '+result.tools.map(tool=>tool.name).join(', ')+' ('+result.tools.length+')';};document.querySelector('#language').onchange=event=>setLocale(event.target.value);
</script></body></html>
