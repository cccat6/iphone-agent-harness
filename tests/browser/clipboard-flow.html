<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clipboard flow fixture</title>
<link rel="stylesheet" href="../../apps/web/styles.css">
<style>body{max-width:560px;padding:20px;margin:auto}h1{font-size:20px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;font-size:12px}#copy-card{margin-top:20px}</style>
<h1>Clipboard UI functional test</h1><p>Uses production UI and controller with a simulated clipboard. This page never reads or writes the system clipboard and sends no phone input.</p>
<button id="prepare" class="secondary-button">Prepare sample text</button>
<label><input id="reject-write" type="checkbox"> Simulate clipboard rejection</label>
<label><input id="reject-save" type="checkbox"> Fail the next receipt save</label>
<div id="copy-card"></div><pre id="results"></pre>
<script type="module">
import {createClipboardController} from '../../apps/web/core/clipboard.js';
import {mountClipboardPanel} from '../../apps/web/ui/clipboard.js';
import {setLocale} from '../../apps/web/i18n.js';
setLocale('zh-Hans');
let writes=0,resumes=0,saves=0;const output=document.querySelector('#results');
const show=()=>{output.textContent=JSON.stringify({writes,saves,resumes,status:controller.getSnapshot()?.status,phoneInputSent:false},null,2);};
const controller=createClipboardController({document:{visibilityState:'visible',hasFocus:()=>true},navigator:{userActivation:{isActive:true},clipboard:{writeText:async()=>{writes++;if(document.querySelector('#reject-write').checked)throw new DOMException('Fixture rejection','NotAllowedError');}}},isSecureContext:()=>true,onChange:show,isCurrent:({sessionId,targetId})=>sessionId==='fixture-session'&&targetId==='fixture-phone'});
mountClipboardPanel(document.querySelector('#copy-card'),{controller,sessionId:'fixture-session',continueAfterCopy:true,onCopied:async()=>{saves++;show();if(document.querySelector('#reject-save').checked){document.querySelector('#reject-save').checked=false;throw Error('Fixture receipt save failed');}resumes++;show();}});
document.querySelector('#prepare').onclick=()=>{controller.clear();controller.prepare({sessionId:'fixture-session',targetId:'fixture-phone',text:'这是一段测试文字，用来确认长文本复制的界面与失败恢复。\nSupports Unicode: 日本語 · Français · Español.\n\u003cscript>not executable\u003c/script>'});};
</script></html>
