<!doctype html><meta charset="utf-8"><title>Main user-flow repair verification</title>
<style>body{font:14px system-ui;margin:16px}iframe{position:fixed;right:16px;top:16px;width:390px;height:calc(100vh - 32px);border:1px solid #999}pre{white-space:pre-wrap;max-width:650px}body{padding-right:420px}button{padding:10px}</style>
<h1>Main user-flow repair verification</h1><p>Real production app, DOM and IndexedDB in Chrome at a phone-sized viewport. iOS identification, model responses and MCP are simulated; this is not physical Safari acceptance.</p><button id="run">Run primary flows</button><button id="cleanup">Remove disposable fixture data</button><pre id="result">Not run</pre><iframe id="app" title="Isolated Harness test"></iframe>
<script type="module">
const iframe=document.querySelector('#app'),output=document.querySelector('#result');
const checks=[],notes=[];const check=(value,name)=>{if(!value)throw new Error(name);checks.push(name);output.textContent=JSON.stringify({running:true,checks},null,2);};
const wait=async(fn,label)=>{for(let n=0;n<150;n++){if(fn())return;await new Promise(r=>setTimeout(r,40));}throw new Error('Timed out: '+label);};
const bootstrap=()=>{
 Object.defineProperty(navigator,'userAgent',{value:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/27.0.1 Mobile/15E148 Safari/604.1'});
 Object.defineProperty(navigator,'platform',{value:'iPhone'});Object.defineProperty(navigator,'maxTouchPoints',{value:5});
 localStorage.setItem('iah.locale','zh-Hans');
 window.qa={connections:[],requests:[],downloads:[],errors:[],persistCalls:0};
 const open=indexedDB.open.bind(indexedDB);indexedDB.open=(name,...args)=>{const r=open('primary-flow-repair:'+name,...args);r.addEventListener('success',()=>qa.connections.push(r.result));return r;};
 const persist=navigator.storage.persist.bind(navigator.storage);navigator.storage.persist=()=>{qa.persistCalls++;return Promise.resolve(false);};navigator.storage.persisted=()=>Promise.resolve(false);
 const origFetch=fetch;window.fetch=async(input,options={})=>{const url=new URL(typeof input==='string'||input instanceof URL?input:input.url,location.href);qa.requests.push({url:url.href,method:options.method||'GET'});
 if(url.hostname==='auth.openai.com'){if(url.pathname.endsWith('/usercode'))return new Promise((resolve,reject)=>{const timer=setTimeout(()=>resolve(Response.json({device_auth_id:'fixture-only',user_code:'TEST-ONLY',interval:1})),1500);options.signal?.addEventListener('abort',()=>{clearTimeout(timer);reject(new DOMException('Aborted','AbortError'));},{once:true});});return Response.json({error:'deviceauth_authorization_pending'},{status:403});}
 if(url.hostname==='model.example'&&url.pathname.endsWith('/models'))return Response.json({data:[{id:'synthetic-flash',context_length:1000000}]});
 if(url.hostname==='model.example'&&url.pathname.endsWith('/chat/completions'))return Response.json({choices:[{message:{role:'assistant',content:'Synthetic model reply for primary flow.'},finish_reason:'stop'}],usage:{prompt_tokens:10,completion_tokens:10}});
 if(url.hostname.endsWith('.mcp.example')){const rpc=JSON.parse(options.body);if(rpc.method==='notifications/initialized')return new Response(null,{status:202});return Response.json({jsonrpc:'2.0',id:rpc.id,result:rpc.method==='initialize'?{protocolVersion:'2025-11-25'}:rpc.method==='tools/list'?{tools:[{name:'lookup',description:url.hostname,inputSchema:{type:'object',properties:{}}}]}:{content:[{type:'text',text:url.hostname}]}});}
 if(url.href.startsWith('https://igent.cc/api/skills'))return Response.json({items:[{name:'Synthetic community skill',description:'Fixture only',creatorId:'a'.repeat(64),slug:'fixture',version:'1.0.0'}]});
 return origFetch(input,options);};
 const urlCreate=URL.createObjectURL.bind(URL);URL.createObjectURL=blob=>{const url=urlCreate(blob);qa.downloads.push({blob,url});return url;};
 const click=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(this.download){qa.lastDownload=this.download;return;}return click.call(this);};
 // The input File/DataTransfer path is real, while the OS file picker is intentionally replaced.
 const inputClick=HTMLInputElement.prototype.click;HTMLInputElement.prototype.click=function(){if(this.type==='file')return;return inputClick.call(this);};
 window.addEventListener('error',e=>qa.errors.push(e.message));window.addEventListener('unhandledrejection',e=>qa.errors.push(String(e.reason)));
};
async function loadApp(){const loaded=new Promise(resolve=>iframe.addEventListener('load',resolve,{once:true}));iframe.src='/apps/web/?fixture='+Date.now();await loaded;await wait(()=>iframe.contentDocument?.querySelector('#new-session')?.onclick&&!iframe.contentDocument.querySelector('#app').inert,'app ready');}
function api(){const win=iframe.contentWindow,doc=iframe.contentDocument;return {win,doc,$:s=>doc.querySelector(s),$$:s=>[...doc.querySelectorAll(s)]};}
async function click(selector){const {$}=api();if(['#open-settings','#open-devices','#open-skills','#new-session','#session-list-menu'].includes(selector)&&$('#app').classList.contains('in-conversation'))$('#back-sessions').click();const el=$(selector);el.scrollIntoView({block:'center'});el.click();await new Promise(r=>setTimeout(r,100));}
async function close(){if(api().$('#panel-dialog').open)await click('#close-panel');}
function fill(selector,value){const {win,$}=api(),el=$(selector);el.value=value;el.dispatchEvent(new win.Event('input',{bubbles:true}));el.dispatchEvent(new win.Event('change',{bubbles:true}));}
document.querySelector('#cleanup').onclick=async()=>{for(const db of iframe.contentWindow?.qa?.connections||[])db.close();const unloaded=new Promise(resolve=>iframe.addEventListener('load',resolve,{once:true}));iframe.src='about:blank';await unloaded;for(const db of await indexedDB.databases())if(db.name.startsWith('primary-flow-repair:'))await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(db.name);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});localStorage.removeItem('iah.locale');output.textContent='Disposable fixture databases removed.';};
document.querySelector('#run').onclick=async()=>{checks.length=0;notes.length=0;try{
 // Origin is dedicated to this disposable fixture; no production browser data is touched.
 for(const db of iframe.contentWindow?.qa?.connections||[])db.close();iframe.src='about:blank';for(const db of await indexedDB.databases())if(db.name.startsWith('primary-flow-repair:'))await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(db.name);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});await loadApp();let {$,$$,win,doc}=api();
 check(!$('#app').hidden,'mobile-layout Harness opens');check(win.qa.persistCalls>0,'storage protection requested on entry');
 await click('#new-session');await wait(()=>$$('.session-row').length,'new session saved');check($('#session-menu').hidden===false,'new session opens conversation');
 await click('#open-settings');await wait(()=>$('#context-form'),'settings ready');
 check($('#context-form [name=triggerTokens]').value==='750000','default context threshold 750k');
 check($('#context-form').checkValidity(),'default context form accepts native browser validation');
 $('#context-form').closest('details').open=true;fill('[name=qualityPreset]','high');$('#context-form').requestSubmit();await wait(()=>$('#context-result').textContent,'context saved through form');await close();await click('#open-settings');
 check($('[name=triggerTokens]').value==='750000'&&$('[name=qualityPreset]').value==='high','context and image preset survive close/reopen');
 check(!$('#panel-content').textContent.includes('本地提取')&&!$('#panel-content').textContent.includes('压缩目标'),'unsupported context controls absent');
 check(!$('#codex-controls'),'no disconnected ChatGPT login card');
 await click('#add-provider');fill('#provider-form [name=name]','Synthetic API');fill('#provider-form [name=baseUrl]','https://model.example/v1');fill('#provider-form [name=secret]','synthetic-not-a-secret');
 await click('#discover-models');await wait(()=>$('#provider-form [name=model]').value==='synthetic-flash','model discovery');
 $('#provider-form [name=stream]').checked=false;$('#provider-form').requestSubmit();await wait(()=>!$('#provider-form')&&$$('[data-provider-edit]').length===1,'provider save');
 check($('#panel-content').textContent.includes('Synthetic API'),'API profile saved');await close();await click('#open-settings');check($$('[data-provider-edit]').length===1,'API profile survives reopen');
 const header=$('.panel-header');for(const d of $$('.settings-section'))d.open=true;$('.panel-body').scrollTop=99999;await new Promise(r=>requestAnimationFrame(r));const r=$('#close-panel').getBoundingClientRect(),h=header.getBoundingClientRect();
 check(r.top>=0&&r.bottom<=win.innerHeight&&h.top>=0,'panel close stays on-screen after scroll');check(doc.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest('#close-panel'),'panel close remains hit-testable');await close();check(!$('#panel-dialog').open,'scrolled panel closes with its X');
 await click('#open-devices');await wait(()=>$('#panel-dialog').open,'devices open');check(!!$('.panel-body').textContent,'device settings open');await close();
 await click('#open-skills');await wait(()=>$('#skills-local'),'skills open');check($$('.skill-card').length>=10,'built-in skills visible');await click('#skills-catalog');await wait(()=>$('#catalog-list').textContent.includes('Synthetic community skill'),'market result');check(win.qa.requests.some(r=>r.url.startsWith('https://igent.cc/api/skills')),'community uses fixed website endpoint');check(!$('#panel-content input[type=url]'),'community endpoint has no user setting');await close();
 await click('#open-settings');$('#mcp-settings details').open=true;
 for(const name of ['Docs','Notes']){await click('[data-mcp-add]');const row=$$('[data-mcp-row]').at(-1);for(const [selector,value]of [['[data-mcp-name]',name],['[data-mcp-endpoint]',`https://${name.toLowerCase()}.mcp.example/mcp`]]){const el=row.querySelector(selector);el.value=value;el.dispatchEvent(new win.Event('input',{bubbles:true}));}row.querySelector('[data-mcp-connect]').click();await wait(()=>row.querySelector('[data-mcp-tool]'),'MCP '+name);}
 check($$('[data-mcp-row]').length===2,'two MCP servers connect in main settings');await close();await click('#open-settings');check($$('[data-mcp-row]').length===2,'two MCP entries survive settings reopen');await close();
 // Native close (Safari-style retired connection) must recover UI reads and writes.
 for(const db of win.qa.connections)db.close();await click('#open-settings');await wait(()=>$('#context-form'),'settings after IDB close');$('#context-form').closest('details').open=true;$('#context-form').requestSubmit();await wait(()=>$('#context-result').textContent,'save after close');await close();
 await click('#open-devices');check($('#panel-dialog').open,'device settings recover after closed DB');await close();await click('#open-skills');check($('#skills-local'),'skills recover after closed DB');await close();const before=$$('.session-row').length;await click('#new-session');await wait(()=>$$('.session-row').length===before+1,'new session after close');check(true,'new session and settings save recover after native DB close');
 fill('#message-input','Fixture conversation with a synthetic model');$('#composer').requestSubmit();await wait(()=>$('#conversation').textContent.includes('Synthetic model reply'),'chat request');check(true,'saved API can send message and display reply');
 await click('#session-menu');await click('[data-action=export]');await wait(()=>win.qa.downloads.length,'export');const exported=win.qa.downloads.at(-1).blob;const data=JSON.parse(await exported.text());check(data.messages.some(m=>m.text==='Synthetic model reply for primary flow.'),'session file includes reply');
 await click('#session-list-menu');await click('#import-session');const dt=new win.DataTransfer();dt.items.add(new win.File([exported],'session-fixture.json',{type:'application/json'}));$('#file-input').files=dt.files;$('#file-input').dispatchEvent(new win.Event('change'));await wait(()=>$$('.session-row').length===before+2,'import session');check($('#conversation').textContent.includes('Synthetic model reply'),'session import restores actual conversation');
 await loadApp();({$,$$,win,doc}=api());check($$('.session-row').length>=3,'reload retains session list');await click('#open-settings');check($$('[data-provider-edit]').length===1&&$$('[data-mcp-row]').length===2,'reload retains API and both MCP profiles');check($('[name=qualityPreset]').value==='high','reload retains image preset');await close();
 for(const width of [320,390,430]){iframe.style.width=width+'px';await new Promise(r=>setTimeout(r,40));const brand=$('.brand-name'),rect=brand.getBoundingClientRect();notes.push({width,innerWidth:win.innerWidth,whiteSpace:win.getComputedStyle(brand).whiteSpace,rect:{right:rect.right,width:rect.width,height:rect.height}});check(win.getComputedStyle(brand).whiteSpace==='nowrap'&&rect.right<=win.innerWidth,'brand fits without wrap at '+width+'px');}
 iframe.style.width='390px';await click('.sidebar .brand');await wait(()=>!$('#site').hidden,'homepage');const entry=$('#site-header [data-route=harness]')||$('.site-header [data-route=harness]');check(entry&&!entry.hidden&&entry.getBoundingClientRect().width>0,'homepage header includes visible Harness entry');entry.click();await wait(()=>!$('#app').hidden,'header Harness entry');check(true,'homepage header returns to Harness');
 check(win.qa.errors.length===0,'no unhandled page errors during complete flow');
 const result={passed:true,checks,notes,scope:'Chrome real DOM and IndexedDB; iOS UA only; all model/community/MCP responses synthetic; no physical capture or HID'};output.textContent=JSON.stringify(result,null,2);await fetch('/qa-result',{method:'POST',body:JSON.stringify(result)});
 }catch(error){const result={passed:false,error:error.message,checks,notes};output.textContent=JSON.stringify(result,null,2);await fetch('/qa-result',{method:'POST',body:JSON.stringify(result)});}};
</script>
