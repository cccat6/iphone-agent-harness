<!doctype html><meta charset="utf-8"><title>History paging acceptance</title><style>body{font:15px system-ui}button{padding:10px;margin:4px}iframe{width:390px;height:740px;border:1px solid #ccc}pre{white-space:pre-wrap}</style>
<h1>History paging acceptance</h1><p>Disposable local data only. No device or model requests.</p><button id="prepare">Prepare 240-message session</button><button id="older">Load older pages</button><button id="newer">Load newer pages</button><button id="inspect">Inspect working set</button><button id="backup">Export and restore test session</button><pre id="output">Ready</pre><iframe id="frame" title="History test Harness"></iframe>
<script type="module">
import {openStore} from '../../apps/web/core/store.js';
import {exportSessionFile,importSessionFile} from '../../apps/web/core/session-files.js';
const frame=document.querySelector('#frame'),output=document.querySelector('#output');let id;
const show=v=>output.textContent=JSON.stringify(v,null,2),wait=async test=>{for(let i=0;i<200;i++){if(test())return;await new Promise(r=>setTimeout(r,40));}throw Error('UI wait timed out');};
const inspect=()=>{const d=frame.contentDocument,rows=[...d.querySelectorAll('[data-message-id]')],images=[...d.querySelectorAll('[data-frame-ref]')];const v={messages:rows.length,characters:rows.reduce((n,e)=>n+(e.querySelector('.message-body')?.textContent.length||0),0),loadedImages:images.filter(e=>e.getAttribute('src')).length,older:!!d.querySelector('#load-older-messages'),newer:!!d.querySelector('#load-newer-messages'),first:rows[0]?.querySelector('.message-body')?.textContent.slice(0,35),last:rows.at(-1)?.querySelector('.message-body')?.textContent.slice(0,35)};v.bounded=v.messages<=120&&v.loadedImages<=8;show(v);return v;};
document.querySelector('#prepare').onclick=async()=>{try{const store=await openStore({name:'primary-flow-repair:iphone-automation-harness'}),s=await store.createSession({title:'QA bounded history 240',mode:'chat'});id=s.id;for(let n=1;n<=240;n++)await store.addMessage(id,{role:n%2?'user':'assistant',text:'Message '+String(n).padStart(3,'0')+' — '+('Saved history 中文. '.repeat(n===240?3000:4)),...(n%8===0?{images:['data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jD1sAAAAASUVORK5CYII=']}: {})});store.close();frame.src='/apps/web/?fixture=history-paging';await wait(()=>frame.contentDocument?.querySelector('[data-session="'+id+'"]'));frame.contentDocument.querySelector('[data-session="'+id+'"]').click();await wait(()=>frame.contentDocument.querySelector('[data-message-id]'));inspect();}catch(e){show({error:e.message});}};
document.querySelector('#older').onclick=async()=>{for(let i=0;i<4;i++){const b=frame.contentDocument.querySelector('#load-older-messages');if(!b)break;b.click();await new Promise(r=>setTimeout(r,160));}inspect();};
document.querySelector('#newer').onclick=async()=>{for(let i=0;i<4;i++){const b=frame.contentDocument.querySelector('#load-newer-messages');if(!b)break;b.click();await new Promise(r=>setTimeout(r,160));}inspect();};document.querySelector('#inspect').onclick=inspect;
document.querySelector('#backup').onclick=async()=>{const store=await openStore({name:'primary-flow-repair:iphone-automation-harness'});try{const original=(await store.listSessions({search:'QA bounded history 240'})).find(s=>s.title==='QA bounded history 240');if(!original)throw Error('Prepare the test session first');const file=await exportSessionFile(store,original.id),restored=await importSessionFile(store,file,{titleSuffix:' QA restored'}),tail=await store.getMessages(restored.id,{limit:1,includeImages:false});show({backupBytes:file.size,restoredMessages:restored.lastSeq,lastMessageCharacters:tail[0]?.text.length,passed:restored.lastSeq===240&&tail[0]?.text.startsWith('Message 240')});await store.deleteSession(restored.id);}catch(e){show({error:e.message});}finally{store.close();}};
</script>
