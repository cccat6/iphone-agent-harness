<!doctype html><meta charset="utf-8"><title>Harness storage migration check</title>
<button id="run">运行隔离数据库迁移检查</button><pre id="result">尚未运行</pre>
<script type="module">
import {openStore} from '../../apps/web/core/store.js';
document.querySelector('#run').onclick=async()=>{
 const name='iah-migration-test-'+crypto.randomUUID();let store;
 try{
  await new Promise((resolve,reject)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sessions',{keyPath:'id'});d.createObjectStore('messages',{keyPath:'id'}).createIndex('sessionId','sessionId');d.createObjectStore('settings',{keyPath:'id'});d.createObjectStore('skills',{keyPath:'id'});};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const d=r.result,t=d.transaction(['sessions','messages'],'readwrite');t.objectStore('sessions').put({id:'legacy',title:'legacy-v1',mode:'chat',lastSeq:1});t.objectStore('messages').put({id:'m1',sessionId:'legacy',role:'user',text:'preserved',seq:1});t.oncomplete=()=>{d.close();resolve();};t.onerror=()=>reject(t.error);};});
  store=await openStore({name});if((await store.getMessages('legacy',{limit:1}))[0].text!=='preserved')throw new Error('v1 message lost');
  const claim=await store.claimRun('legacy','run-test',{mode:'plan'});let refused=false;try{await store.claimRun('legacy','run-other',{mode:'plan'});}catch{refused=true;}if(!refused)throw new Error('duplicate writer admitted');await store.finishRun('legacy',claim.id,'completed');
  const f=await store.saveFrame('legacy',{blob:new Blob(['a'],{type:'image/jpeg'}),frameId:'test-frame'});
  await store.addMessage('legacy',{role:'assistant',text:'',toolCalls:[{id:'c1',name:'phone_observe',arguments:{}}]});await store.addMessage('legacy',{role:'tool',text:'frame',toolCallId:'c1',frameRefs:[f.assetRef]});
  const exported=await store.exportSession('legacy'),imported=await store.importSession(exported),messages=await store.getMessages(imported.id);
  if(messages[1].toolCalls[0].id!=='c1'||messages[2].toolCallId!=='c1'||messages[2].images[0]!=='data:image/jpeg;base64,YQ==')throw new Error('tool or image import lost');
  const page=await store.getMessages('legacy',{limit:2,includeImages:false});if(page.length!==2||page[0].seq!==2||page[1].seq!==3)throw new Error('indexed paging incorrect');
  await store.saveSettings({qaRetention:'unchanged'});await store.saveSkill({id:'qa-retained',name:'Synthetic retained Skill',content:'test'});await store.addEvent('legacy',{type:'qa.delete-check'});
  await store.deleteSession('legacy');store.close();store=await openStore({name});
  if(await store.getSession('legacy')||(await store.getMessages('legacy')).length||await store.getFrame(f.assetRef)||(await store.getEvents('legacy')).length)throw new Error('deleted session or related media/events survived reopen');
  if(!(await store.getSession(imported.id))||(await store.getMessages(imported.id)).length!==3||(await store.getSettings()).qaRetention!=='unchanged'||!(await store.listSkills()).some(s=>s.id==='qa-retained'))throw new Error('deletion crossed session or settings boundary');
  const restored=await store.importSession(exported);if((await store.getMessages(restored.id))[2].images[0]!=='data:image/jpeg;base64,YQ==')throw new Error('explicit backup restore lost image');
  const second=await openStore({name});let publicId;
  try{const ids=await Promise.all([store.ensureDeviceClientId('https://harness-qa.local'),second.ensureDeviceClientId('https://harness-qa.local')]);if(ids[0]!==ids[1])throw new Error('concurrent handles created different device IDs');publicId=ids[0];}finally{second.close();}
  store.close();store=await openStore({name});if(await store.ensureDeviceClientId('https://harness-qa.local')!==publicId)throw new Error('device identity changed after reopen');
  document.querySelector('#result').textContent=JSON.stringify({passed:true,checks:['v1-to-v2-preserves-message','exclusive-run-lease','blob-attachment-persistence','tool-and-image-export-import','indexed-pagination','session-delete-cascade-and-reopen','other-session-settings-skills-preserved','explicit-backup-restore','stable-device-client-id-two-handles-and-reopen']},null,2);
 }catch(e){document.querySelector('#result').textContent=JSON.stringify({passed:false,error:e.message});}
 finally{store?.close();indexedDB.deleteDatabase(name);}
};
</script>
