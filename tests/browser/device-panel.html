<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Device panel · isolated UI fixture</title><link rel="stylesheet" href="../../apps/web/styles.css"><body style="padding:24px"><h1>Device panel · isolated UI fixture</h1><p>No hardware, network, screen capture or real credentials. Native key input tests the foreground collector only.</p><button id="open" class="primary">Open mock device setup</button><select id="language"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option></select><pre id="result">No published device.</pre><dialog id="panel-dialog" class="panel-dialog"><div id="panel-content"></div></dialog><script type="module">
import {createDevicePanel} from '../../apps/web/ui/device-panel.js';
import {setLocale,getLocale} from '../../apps/web/i18n.js';
import {openStore} from '../../apps/web/core/store.js';
let settings={deviceEndpoint:'https://iah-test.local',deviceFingerprint:'a'.repeat(64)},output=document.querySelector('#result');
const store=await openStore({name:'iah-device-panel-fixture'});if(!(await store.getSettings()).deviceEndpoint)await store.saveSettings(settings);settings=await store.getSettings();
class FixtureClient{
 constructor(){this.paired=false;this.identityVerified=false;this.bindingVerified=false;this.boardId='board-test';this.bootId='boot-test';this.clientId='client-test';this.targetId=null;this.leaseId=null;}
 async pair({clientId}){this.clientId=clientId;this.paired=true;this.identityVerified=true;return this.status();}
 async identity(){return this.status();}async pinIdentity(){this.identityVerified=true;return this.status();}
 async getBinding(){return {...this.status(),targets:[{targetId:'phone-test',connected:true,encrypted:true,hidSubscribed:true,inputState:'released',running:false}]};}
 async startChallenge(targetId){return {challengeId:'challenge-test',targetId,length:8,status:'typing',expiresInMs:30000};}
 async confirmChallenge(targetId,{observedNonce}){if(observedNonce!=='12345678')throw new Error('Mock proof expected 12345678. No device was contacted.');this.targetId=targetId;this.bindingVerified=true;return this.status();}
 async claimLease(){this.leaseId='lease-test';}async endRun(){this.leaseId=null;return {status:'released'};}
 status(){return {paired:this.paired,identityVerified:this.identityVerified,bindingVerified:this.bindingVerified,boardId:this.boardId,bootId:this.bootId,clientId:this.clientId,targetId:this.targetId,publicKeyFingerprint:settings.deviceFingerprint};}
 exportCredentials(){return {format:'iah-device-credential/1',baseUrl:settings.deviceEndpoint,expectedFingerprint:settings.deviceFingerprint};}restoreCredentials(){this.paired=true;}clearCredentials(){this.paired=false;}
}
const capture={active:false,async start(){this.active=true;},stop(){this.active=false;}};
const panel=createDevicePanel({store,capture,clientFactory:()=>new FixtureClient(),openPanel:(title,subtitle,html)=>{document.querySelector('#panel-content').innerHTML=`<div class="panel-header"><div><h2>${title}</h2><p>${subtitle}</p></div><button id="close" aria-label="Close">×</button></div><label>Fixture language <select id="panel-language">${document.querySelector('#language').innerHTML}</select></label><div class="panel-body">${html}</div>`;document.querySelector('#panel-language').value=getLocale();document.querySelector('#panel-language').onchange=event=>setLocale(event.target.value);document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();document.querySelector('dialog').showModal();},getPanelRoot:()=>document.querySelector('.panel-body'),onDeviceChange:device=>output.textContent=device?'MOCK device published after native input and settings attestation.':'No published device.'});
document.querySelector('#language').value=getLocale();document.querySelector('#open').onclick=()=>panel.open();document.querySelector('#language').onchange=event=>setLocale(event.target.value);
</script></body></html>
