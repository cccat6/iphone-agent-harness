<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP multi-server UI verification</title><link rel="stylesheet" href="../../apps/web/styles.css"><body style="max-width:760px;margin:24px auto;padding:20px"><h1>MCP multi-server UI verification</h1><p>Actual UI and storage with two simulated MCP servers. No real network request or credential.</p><button id="run">Run checks</button><pre id="result">Not run</pre><div id="mcp"></div><script type="module">
import {createMCPAccess} from '../../apps/web/core/mcp.js';
import {createMCPSettings} from '../../apps/web/ui/mcp-settings.js';
import {openStore} from '../../apps/web/core/store.js';
import {setLocale,SUPPORTED_LOCALES,localizeError} from '../../apps/web/i18n.js';
import {MCP_MESSAGES} from '../../apps/web/locales/mcp.js';
const one=(s,r=document)=>r.querySelector(s),check=(condition,label)=>{if(!condition)throw new Error(label);};
one('#run').onclick=async()=>{
 let view,store;const dbName='mcp-browser-persistence-'+crypto.randomUUID(),previous=localStorage.getItem('iah.locale');
 try{
  store=await openStore({name:dbName});const calls=[];
  const fetchImpl=async(url,options)=>{
   const rpc=JSON.parse(options.body),host=new URL(url).hostname;calls.push([host,rpc.method]);
   if(host==='unavailable.example')return new Response(null,{status:503});
   if(rpc.method==='notifications/initialized')return new Response(null,{status:202});
   const result=rpc.method==='initialize'?{protocolVersion:'2025-11-25'}:rpc.method==='tools/list'?{tools:[{name:'lookup',description:host,inputSchema:{type:'object',properties:{}}}]}:{content:[{type:'text',text:host}]};
   return Response.json({jsonrpc:'2.0',id:rpc.id,result});
  };const access=createMCPAccess({fetchImpl});
  view=createMCPSettings({access,store});view.mount(one('#mcp'));one('details').open=true;
  for(const name of ['Docs','Notes']){
   one('[data-mcp-add]').click();const card=[...document.querySelectorAll('[data-mcp-row]')].at(-1);
   for(const [selector,value] of [['[data-mcp-name]',name],['[data-mcp-endpoint]','https://'+name.toLowerCase()+'.example/mcp']]){one(selector,card).value=value;one(selector,card).dispatchEvent(new Event('input'));}
   one('[data-mcp-token]',card).value='synthetic-only';await one('[data-mcp-connect]',card).onclick();check(one('[data-mcp-token]',card).value==='','token cleared');
   one('[data-mcp-tool]',card).checked=true;one('[data-mcp-tool]',card).dispatchEvent(new Event('change'));
   one('[data-mcp-enable]',card).checked=true;one('[data-mcp-enable]',card).dispatchEvent(new Event('change'));
  }
  const settings=await store.getSettings(),directory=await access.listForModel();check(settings.mcpServers.length===2,'both entries saved');check(directory.tools.length===2,'two selected tools');check(!JSON.stringify(settings).includes('synthetic-only'),'token not saved');
  for(const tool of directory.tools){const response=await access.call({serverId:tool.serverId,name:tool.name,arguments:{}},{mode:'task'});check(response.result.content[0].text===tool.serverName.toLowerCase()+'.example','tool routed to chosen server');}
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);check(one('[data-mcp-add]').textContent===MCP_MESSAGES[code].add,'locale '+code);check(document.querySelectorAll('[data-mcp-row]').length===2,'locale keeps rows');check(one('[data-mcp-name]').value==='Docs','locale keeps custom name');}
  await one('[data-mcp-remove]').onclick();check((await store.getSettings()).mcpServers.length===1,'remove persisted');check((await access.listForModel()).tools[0].serverName==='Notes','other server remains enabled');
  one('[data-mcp-add]').click();const defaultCard=[...document.querySelectorAll('[data-mcp-row]')].at(-1);one('[data-mcp-endpoint]',defaultCard).value='https://default-name.example/mcp';one('[data-mcp-endpoint]',defaultCard).dispatchEvent(new Event('input'));await one('[data-mcp-connect]',defaultCard).onclick();check(one('[data-mcp-name]',defaultCard).value==='default-name.example','derived name shown in input');
  one('[data-mcp-endpoint]',defaultCard).value='https://unavailable.example/mcp';one('[data-mcp-endpoint]',defaultCard).dispatchEvent(new Event('input'));await one('[data-mcp-connect]',defaultCard).onclick();const count=calls.length;
  for(const {code} of SUPPORTED_LOCALES){setLocale(code);check(one('[data-mcp-status]',defaultCard).textContent===localizeError(Object.assign(new Error('MCP_CONNECTION_FAILED'),{code:'MCP_CONNECTION_FAILED'})),'live error locale '+code);}
  check(calls.length===count,'locale change does not reconnect');check((await access.listForModel()).tools[0].serverName==='Notes','failed third server leaves Notes enabled');
  const saved=await store.getSettings();view.disposeView();store.close();store=await openStore({name:dbName});
  const restoredAccess=createMCPAccess({fetchImpl});view=createMCPSettings({access:restoredAccess,store});await view.restore({servers:saved.mcpServers});view.mount(one('#mcp'),{servers:saved.mcpServers});
  one('#mcp > details').open=true;check([...document.querySelectorAll('[data-mcp-row]')].every(card=>!card.open),'restored servers are compact summaries');
  check((await restoredAccess.listForModel()).tools[0].serverName==='Notes','fresh access instance restores enabled tools');
  const notesCard=[...document.querySelectorAll('[data-mcp-row]')].find(card=>one('[data-mcp-title]',card).textContent==='Notes');notesCard.open=true;
  check(one('[data-mcp-status]',notesCard).textContent.includes('1'),'restored summary shows tool count');
  await one('[data-mcp-connect]',notesCard).onclick();check((await restoredAccess.listForModel()).tools[0].serverName==='Notes','blank token reconnect retains credential and selected tools');
  one('#result').textContent=JSON.stringify({passed:true,checks:['add-two','save-two','enable-two','call-each-with-same-tool-name','eight-locales-preserve-input','remove-one-preserves-other','derived-name-visible','connection-error-eight-locales-no-retry','fresh-database-and-access-restore','compact-saved-server-summaries','blank-token-retains-credential-and-grants'],calls:calls.length},null,2);
 }catch(error){one('#result').textContent=JSON.stringify({passed:false,error:error.message},null,2);}
 finally{view?.disposeView();store?.close();indexedDB.deleteDatabase(dbName);setLocale(previous||'auto');}
};
</script></body></html>
