<!doctype html><meta charset="utf-8"><title>RTC control API acceptance</title><h1>RTC control API acceptance</h1><p>No HID input is sent. This exercises the real production RPC and its authorization boundaries.</p><button id="run">Run API checks</button><pre id="result">Ready</pre><script type="module">
import {DeviceRTCTransport} from '../../apps/web/core/device-rtc.js';
import {DeviceClient} from '../../apps/web/core/device.js';
const output=document.querySelector('#result');let active;
const show=value=>{output.textContent=JSON.stringify(value,null,2);if(typeof value.passed==='boolean')fetch('/qa-result',{method:'POST',body:JSON.stringify(value)}).catch(()=>{});};
document.querySelector('#run').onclick=async()=>{if(active)return;const rows=[],report={startedAt:new Date().toISOString(),phoneInputSent:false,rows};active=true;let bridge;
try{const defaults=await(await fetch('../../apps/web/firmware/rtc-defaults.json',{cache:'no-store'})).json();const host=new URLSearchParams(location.search).get('host')||'igent.local';const configuration={baseUrl:'http://igent.local',rtc:{...defaults,host},timeoutMs:Number(new URLSearchParams(location.search).get('timeout'))||8000};
bridge=new DeviceRTCTransport(configuration);await bridge.open();const client=new DeviceClient({baseUrl:configuration.baseUrl,fetchImpl:bridge.fetch});const identity=await client.identity();rows.push({test:'identity-over-rtc',passed:!!identity.rtc&&identity.transport==='webrtc-direct',boardId:identity.boardId});show(report);
await client.pair({clientId:'desktop-rtc-acceptance'});const credential=client.exportCredentials();const binding=await client.getBinding();rows.push({test:'pair-and-binding',passed:client.identityVerified&&Array.isArray(binding.targets),connectedPhones:binding.targets.filter(t=>t.connected&&t.encrypted&&t.hidSubscribed).length,inputVerified:client.bindingVerified});
const capabilities=await client.capabilities();rows.push({test:'capabilities',passed:capabilities.transport==='webrtc-direct',freeHeap:capabilities.freeHeapBytes,minFreeHeap:capabilities.minFreeHeapBytes});await client.clockSync(3);rows.push({test:'clock-sync',passed:true});show(report);
const missing=await bridge.fetch('http://igent.local/v1/binding');rows.push({test:'unauthenticated-binding-refused',passed:missing.status===401,status:missing.status});
const padding=await bridge.fetch('http://igent.local/v1/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientId:'desktop-rtc-acceptance',padding:'x'.repeat(Math.min(7000,Math.max(100,Number(new URLSearchParams(location.search).get('bytes'))||7000)))})});rows.push({test:'large-fragmented-invalid-request-replied-without-input',passed:padding.status===400,status:padding.status});
const last=await client.identity();rows.push({test:'connection-survives-large-rejection',passed:last.bootId===identity.bootId});bridge.close();bridge=new DeviceRTCTransport(configuration);await bridge.open();const restored=new DeviceClient({baseUrl:configuration.baseUrl,fetchImpl:bridge.fetch});restored.restoreCredentials(credential);await restored.pinIdentity(credential.expectedFingerprint);await restored.getBinding();rows.push({test:'new-connection-reuses-credential',passed:restored.identityVerified});
report.passed=rows.every(row=>row.passed);report.finishedAt=new Date().toISOString();show(report);
}catch(error){rows.push({test:'failure',passed:false,code:error.code||error.name,message:error.message});report.passed=false;show(report);}finally{bridge?.close();active=false;}}
</script>
