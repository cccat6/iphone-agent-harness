<!doctype html><meta charset="utf-8"><title>Mobile viewport functional check</title>
<style>body{font:14px system-ui;margin:16px;background:#eee}button{padding:10px;margin:4px}iframe{display:block;width:390px;height:844px;border:0;background:white}pre{white-space:pre-wrap;max-width:1100px;max-height:115px;overflow:auto;font-size:11px}</style>
<h1>Simulated keyboard geometry</h1>
<p>Production UI and native DOM. Screen size and keyboard viewport are synthetic; no phone or model requests.</p>
<button id="keyboard">Open keyboard viewport</button><button id="pan">Pan focused viewport</button><button id="restore">Close keyboard viewport</button><button id="landscape">Landscape 844 × 390</button><button id="zoom">Zoom 2× and pan</button><button id="portrait">Portrait 390 × 844</button><button id="inspect">Inspect layout</button>
<pre id="result"></pre><iframe title="Mobile Harness" id="mobile" src="/apps/web/?fixture=mobile-viewport"></iframe>
<script>
const frame=document.querySelector('#mobile'),result=document.querySelector('#result');
// Test controls emulate OS viewport changes without stealing the input focus.
document.querySelectorAll('button').forEach(button=>button.addEventListener('mousedown',event=>event.preventDefault()));
function viewport(height,top=0,extra={}){frame.contentWindow.postMessage({type:'iah-test-viewport',height,top,...extra},location.origin);}
document.querySelector('#landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px';viewport(390,0,{width:844});};
document.querySelector('#portrait').onclick=()=>{frame.style.width='390px';frame.style.height='844px';viewport(844,0,{width:390});};
document.querySelector('#zoom').onclick=()=>viewport(195,40,{width:422,scale:2,left:90});
document.querySelector('#keyboard').onclick=()=>viewport(430);
document.querySelector('#pan').onclick=()=>viewport(430,70);
document.querySelector('#restore').onclick=()=>viewport(844);
document.querySelector('#inspect').onclick=()=>{
 const w=frame.contentWindow,d=w.document,v=w.visualViewport,rect=e=>e?.getBoundingClientRect().toJSON();
 const panel=d.querySelector('#panel-dialog'),active=panel.open?panel:d.querySelector('#app');
 const r=rect(active),close=panel.open?rect(d.querySelector('#close-panel')):null;
 result.textContent=JSON.stringify({viewport:{width:v.width,height:v.height,top:v.offsetTop,left:v.offsetLeft,scale:v.scale},surface:r,close,documentScroll:d.scrollingElement.scrollTop,featureTypes:{capture:typeof w.navigator.mediaDevices?.getDisplayMedia,recorder:typeof w.MediaRecorder,recorderTypes:typeof w.MediaRecorder?.isTypeSupported,image:typeof w.ImageCapture,imageFrame:typeof w.ImageCapture?.prototype?.grabFrame,canvas:typeof w.OffscreenCanvas,blob:typeof w.OffscreenCanvas?.prototype?.convertToBlob},bodyBackground:w.getComputedStyle(d.body).backgroundColor,sidebarBackground:w.getComputedStyle(d.querySelector('.sidebar')).backgroundColor,footer:w.getComputedStyle(d.querySelector('.sidebar-footer')).display,compact:d.body.classList.contains('compact-viewport'),keyboard:d.body.classList.contains('keyboard-visible'),sidebar:w.getComputedStyle(d.querySelector('.sidebar')).display,workspace:w.getComputedStyle(d.querySelector('.workspace')).display,passed:Math.abs(r.left-v.offsetLeft)<1&&Math.abs(r.width-v.width)<1&&Math.abs(r.top-v.offsetTop)<1&&Math.abs(r.height-v.height)<1&&(!close||close.top>=v.offsetTop&&close.bottom<=v.offsetTop+v.height&&close.left>=v.offsetLeft&&close.right<=v.offsetLeft+v.width)&&d.scrollingElement.scrollTop===0});
};
</script>
