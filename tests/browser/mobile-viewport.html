<!doctype html><meta charset="utf-8"><title>Mobile viewport functional check</title>
<style>body{font:14px system-ui;margin:16px;background:#eee}button{padding:10px;margin:4px}iframe{display:block;width:390px;height:844px;border:0;background:white}pre{white-space:pre-wrap;max-width:700px}</style>
<h1>Simulated keyboard geometry</h1>
<p>Production UI and native DOM. Screen size and keyboard viewport are synthetic; no phone or model requests.</p>
<button id="keyboard">Open keyboard viewport</button><button id="pan">Pan focused viewport</button><button id="restore">Close keyboard viewport</button><button id="inspect">Inspect layout</button>
<pre id="result"></pre><iframe title="Mobile Harness" id="mobile" src="/apps/web/?fixture=mobile-viewport"></iframe>
<script>
const frame=document.querySelector('#mobile'),result=document.querySelector('#result');
function viewport(height,top=0){frame.contentWindow.postMessage({type:'iah-test-viewport',height,top},location.origin);}
document.querySelector('#keyboard').onclick=()=>viewport(430);
document.querySelector('#pan').onclick=()=>viewport(430,70);
document.querySelector('#restore').onclick=()=>viewport(844);
document.querySelector('#inspect').onclick=()=>{
 const w=frame.contentWindow,d=w.document,v=w.visualViewport,rect=e=>e?.getBoundingClientRect().toJSON();
 const panel=d.querySelector('#panel-dialog'),active=panel.open?panel:d.querySelector('#app');
 const r=rect(active),close=panel.open?rect(d.querySelector('#close-panel')):null;
 result.textContent=JSON.stringify({viewport:{height:v.height,top:v.offsetTop},surface:r,close,documentScroll:d.scrollingElement.scrollTop,bodyBackground:w.getComputedStyle(d.body).backgroundColor,sidebarBackground:w.getComputedStyle(d.querySelector('.sidebar')).backgroundColor,footer:w.getComputedStyle(d.querySelector('.sidebar-footer')).display,passed:Math.abs(r.top-v.offsetTop)<1&&Math.abs(r.height-v.height)<1&&(!close||close.top>=v.offsetTop&&close.bottom<=v.offsetTop+v.height)&&d.scrollingElement.scrollTop===0},null,2);
};
</script>
